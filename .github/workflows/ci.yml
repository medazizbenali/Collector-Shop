name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - lint/typecheck/test/build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # pour éviter les erreurs compile (à remplacer ensuite par vraie config)
      NEXT_PUBLIC_API_URL: http://localhost:8080
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present -- --ci
      - run: npm run build --if-present

  services:
    name: Microservices - lint/typecheck/test (auto-detect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests in each microservice folder that has package.json
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dir in microservices/*; do
            if [ -f "$dir/package.json" ]; then
              echo "==> Testing $dir"
              pushd "$dir" >/dev/null
              npm ci
              npm run lint --if-present
              npm run typecheck --if-present
              npm test --if-present -- --ci
              popd >/dev/null
            fi
          done

  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: [frontend, services]
    steps:
      - uses: actions/checkout@v4

      # (optionnel) si vous voulez que Sonar récupère la coverage, il faut que les jobs produisent des artefacts.
      # On commence simple : analyse sans coverage, puis on ajoute coverage ensuite.

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

  docker-scan:
    name: Docker build + Trivy scan (front & back)
    runs-on: ubuntu-latest
    needs: [frontend, services]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        run: |
          docker build -t collector-front:ci -f frontend/Dockerfile frontend

          - name: Build backend images (compose)
        run: |
          docker compose -f docker-compose.microservices.yml build

      - name: Get auth-service image id
        shell: bash
        run: |
          set -e
          IMG="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'auth-service' | head -n 1)"
          echo "AUTH_IMAGE=$IMG" >> $GITHUB_ENV
          echo "Detected backend image: $IMG"



      - name: Trivy scan - frontend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "collector-front:ci"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

       - name: Trivy scan - backend (auth-service)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.AUTH_IMAGE }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
