version: '3.8'

services:
  # ==================== KAFKA KRAFT (NO ZOOKEEPER) ====================
  kafka-broker-1:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-broker-1
    container_name: kafka-broker-1
    user: root
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-broker-1:29092,CONTROLLER://kafka-broker-1:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-1:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-broker-1-data:/tmp/kraft-combined-logs
    networks:
      - microservices-network

  kafka-broker-2:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-broker-2
    container_name: kafka-broker-2
    user: root
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-broker-2:29092,CONTROLLER://kafka-broker-2:29093,PLAINTEXT_HOST://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-2:29092,PLAINTEXT_HOST://localhost:9093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-broker-2-data:/tmp/kraft-combined-logs
    networks:
      - microservices-network

  kafka-broker-3:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka-broker-3
    container_name: kafka-broker-3
    user: root
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker-1:29093,2@kafka-broker-2:29093,3@kafka-broker-3:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka-broker-3:29092,CONTROLLER://kafka-broker-3:29093,PLAINTEXT_HOST://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker-3:29092,PLAINTEXT_HOST://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-broker-3-data:/tmp/kraft-combined-logs
    networks:
      - microservices-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: collector-shop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
    depends_on:
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    networks:
      - microservices-network

  # ==================== DATABASES ====================
  postgres-auth:
    image: postgres:15-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5434:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  postgres-articles:
    image: postgres:15-alpine
    container_name: postgres-articles
    environment:
      POSTGRES_DB: articles_db
      POSTGRES_USER: articles_user
      POSTGRES_PASSWORD: articles_password
    ports:
      - "5438:5432"
    volumes:
      - postgres-articles-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  postgres-orders:
    image: postgres:15-alpine
    container_name: postgres-orders
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_password
    ports:
      - "5435:5432"
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  postgres-payments:
    image: postgres:15-alpine
    container_name: postgres-payments
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: payments_user
      POSTGRES_PASSWORD: payments_password
    ports:
      - "5436:5432"
    volumes:
      - postgres-payments-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  postgres-shops:
    image: postgres:15-alpine
    container_name: postgres-shops
    environment:
      POSTGRES_DB: shops_db
      POSTGRES_USER: shops_user
      POSTGRES_PASSWORD: shops_password
    ports:
      - "5437:5432"
    volumes:
      - postgres-shops-data:/var/lib/postgresql/data
    networks:
      - microservices-network

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - microservices-network

  # ==================== ELASTICSEARCH ====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - microservices-network

  # ==================== MICROSERVICES ====================
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      SERVICE_NAME: auth-service
      DATABASE_HOST: postgres-auth
      DATABASE_PORT: 5432
      DATABASE_USER: auth_user
      DATABASE_PASSWORD: auth_password
      DATABASE_NAME: auth_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - postgres-auth
      - redis
      - kafka-broker-1
      - kafka-broker-2
      - kafka-broker-3
    networks:
      - microservices-network

  articles-service:
    build:
      context: ./microservices/articles-service
      dockerfile: Dockerfile
    container_name: articles-service
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      SERVICE_NAME: articles-service
      DATABASE_HOST: postgres-articles
      DATABASE_PORT: 5432
      DATABASE_USER: articles_user
      DATABASE_PASSWORD: articles_password
      DATABASE_NAME: articles_db
      KAFKA_BROKERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - postgres-articles
      - kafka-broker-1
      - elasticsearch
    networks:
      - microservices-network

  orders-service:
    build:
      context: ./microservices/orders-service
      dockerfile: Dockerfile
    container_name: orders-service
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      SERVICE_NAME: orders-service
      DATABASE_HOST: postgres-orders
      DATABASE_PORT: 5432
      DATABASE_USER: orders_user
      DATABASE_PASSWORD: orders_password
      DATABASE_NAME: orders_db
      JWT_SECRET: change-this-super-secret-jwt-key-in-production-min-32-chars
      KAFKA_BROKERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
    depends_on:
      - postgres-orders
      - kafka-broker-1
    networks:
      - microservices-network

  payment-service:
    build:
      context: ./microservices/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8006:8006"
    environment:
      PORT: 8006
      SERVICE_NAME: payment-service
      DATABASE_HOST: postgres-payments
      DATABASE_PORT: 5432
      DATABASE_USER: payments_user
      DATABASE_PASSWORD: payments_password
      DATABASE_NAME: payments_db
      KAFKA_BROKERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      - postgres-payments
      - kafka-broker-1
    networks:
      - microservices-network

  cart-service:
    build:
      context: ./microservices/cart-service
      dockerfile: Dockerfile
    container_name: cart-service
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      SERVICE_NAME: cart-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
      JWT_SECRET: change-this-super-secret-jwt-key-in-production-min-32-chars
    depends_on:
      - redis
      - kafka-broker-1
    networks:
      - microservices-network

  shops-service:
    build:
      context: ./microservices/shops-service
      dockerfile: Dockerfile
    container_name: shops-service
    ports:
      - "8005:8005"
    environment:
      PORT: 8005
      SERVICE_NAME: shops-service
      DATABASE_HOST: postgres-shops
      DATABASE_PORT: 5432
      DATABASE_USER: shops_user
      DATABASE_PASSWORD: shops_password
      DATABASE_NAME: shops_db
      JWT_SECRET: change-this-super-secret-jwt-key-in-production-min-32-chars
      KAFKA_BROKERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
    depends_on:
      - postgres-shops
      - kafka-broker-1
    networks:
      - microservices-network

  search-service:
    build:
      context: ./microservices/search-service
      dockerfile: Dockerfile
    container_name: search-service
    ports:
      - "8007:8007"
    environment:
      PORT: 8007
      SERVICE_NAME: search-service
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKERS: kafka-broker-1:29092,kafka-broker-2:29092,kafka-broker-3:29092
    depends_on:
      - elasticsearch
      - kafka-broker-1
    networks:
      - microservices-network

  # ==================== API GATEWAY ====================
  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - articles-service
      - orders-service
      - payment-service
      - cart-service
      - shops-service
      - search-service
    networks:
      - microservices-network

  # ==================== MONITORING ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - microservices-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - microservices-network

  # ==================== ELK STACK ====================
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - elasticsearch
    networks:
      - microservices-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - microservices-network

volumes:
  kafka-broker-1-data:
  kafka-broker-2-data:
  kafka-broker-3-data:
  postgres-auth-data:
  postgres-articles-data:
  postgres-orders-data:
  postgres-payments-data:
  postgres-shops-data:
  redis-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:

networks:
  microservices-network:
    driver: bridge
